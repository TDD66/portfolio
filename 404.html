<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--color-accent);
            line-height: 1;
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 1.2rem;
            color: var(--color-text-secondary);
            margin-bottom: 32px;
        }

        .back-link {
            display: inline-block;
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--color-accent);
            border-radius: 6px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-page">
            <div class="error-code">404</div>
            <p class="error-message">This page doesn't exist.</p>
            <a href="/" class="back-link">Back to CV</a>
        </div>
    </div>
</body>
</html>
