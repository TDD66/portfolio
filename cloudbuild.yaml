options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: "gcr.io/cloud-builders/gsutil"
    args: ["-m", "rsync", "-r", "-d", "-c", "-x", "^\\.git|^\\.claude|^\\.gcloudignore$|^cloudbuild\\.yaml$", ".", "gs://my-portfolio-66"]

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "compute"
      - "url-maps"
      - "invalidate-cdn-cache"
      - "portfolio-lb"
      - "--path"
      - "/*"
